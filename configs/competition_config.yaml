# One-pass convex_3d registration diagnostics. There are no learned weights.
# Usage: python experiments/train_competition.py --config configs/competition_config.yaml --data Datasets --output outputs/NEW_RUN
# An optional --val ROOT requires a separate ROOT/val directory and disjoint cases.
model: convex_3d

data:
  target_size: [128, 128, 128]  # D, H, W on the optimization grid

training:
  num_epochs: 1  # diagnostics pass, not network training
  batch_size: 1
  num_workers: 0
  seed: 42
  use_scheduler: false

registration:
  max_iter: 100
  lr: 0.1
  tv_weight: 0.01
  similarity: mse

# Augmentations are disabled: this runner does not learn network parameters.
augmentation:
  elastic_deform: false
  random_flip: false
  intensity_aug: false
