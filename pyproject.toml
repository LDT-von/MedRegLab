[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "medreglab"
version = "0.1.0"
description = "Medical Image Registration Laboratory - 跨模态(MR-CT)医学图像配准工具箱"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["medical-image-registration", "deep-learning", "convex-optimization", "learn2reg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.20.0",
    "monai>=0.9.0",
    "SimpleITK>=2.2.0",
    "nibabel>=4.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "tqdm>=4.62.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/LDT-von/MedRegLab"
Documentation = "https://github.com/LDT-von/MedRegLab#readme"
Repository = "https://github.com/LDT-von/MedRegLab.git"
Issues = "https://github.com/LDT-von/MedRegLab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["medreglab*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
